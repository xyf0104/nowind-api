<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex, nofollow" />
    <title>正在维护 - XIASS API</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #061720;
        color: #e6f1f5;
      }

      * { box-sizing: border-box; }

      html, body { min-height: 100%; margin: 0; }

      body {
        display: grid;
        min-height: 100vh;
        place-items: center;
        overflow: hidden;
        background: #061720;
      }

      main {
        width: min(100% - 32px, 640px);
        padding: 48px 0;
        text-align: center;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: #a8c2cc;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: .08em;
        text-transform: uppercase;
      }

      .mark {
        display: grid;
        width: 30px;
        height: 30px;
        place-items: center;
        border: 1px solid #2a6475;
        border-radius: 8px;
        color: #5ed5c3;
        font-size: 14px;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 42px;
        color: #5ed5c3;
        font-size: 13px;
        font-weight: 650;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #5ed5c3;
        box-shadow: 0 0 0 5px rgba(94, 213, 195, .12);
        animation: breathe 1.8s ease-in-out infinite;
      }

      h1 {
        margin: 18px 0 12px;
        color: #f3fafc;
        font-size: clamp(32px, 8vw, 56px);
        line-height: 1.08;
        letter-spacing: 0;
      }

      p {
        max-width: 480px;
        margin: 0 auto;
        color: #9db5be;
        font-size: 16px;
        line-height: 1.75;
      }

      .progress {
        position: relative;
        width: min(100%, 360px);
        height: 2px;
        margin: 34px auto 0;
        overflow: hidden;
        background: #18343e;
      }

      .progress::after {
        position: absolute;
        inset: 0 auto 0 -35%;
        width: 35%;
        content: "";
        background: #5ed5c3;
        animation: move 2.2s ease-in-out infinite;
      }

      .hint {
        margin-top: 18px;
        color: #66828d;
        font-size: 12px;
      }

      @keyframes breathe {
        0%, 100% { opacity: .55; transform: scale(.9); }
        50% { opacity: 1; transform: scale(1.1); }
      }

      @keyframes move {
        0% { transform: translateX(0); }
        100% { transform: translateX(385%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .status-dot, .progress::after { animation: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand"><span class="mark" aria-hidden="true">X</span><span>XIASS API</span></div>
      <div class="status"><span class="status-dot" aria-hidden="true"></span><span>系统状态</span></div>
      <h1>正在维护</h1>
      <p>中转服务器升级中，服务恢复后页面会自动可用。请稍后再试。</p>
      <div class="progress" role="progressbar" aria-label="维护进行中"></div>
      <div class="hint">XIASS API · maintenance</div>
    </main>
  </body>
</html>
