name: Retarget Stable Image

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Existing image tag to use for latest'
        required: true
        default: '1.1.82'
        type: string

permissions:
  packages: write

jobs:
  retarget:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retarget latest image
        env:
          SOURCE_TAG: ${{ inputs.source }}
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/xiass-api:latest" \
            "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/xiass-api:${SOURCE_TAG}"
